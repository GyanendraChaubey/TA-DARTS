<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MT-DARTS — Multi-task Differentiable Architecture Search framework for medical imaging">
    <title>MT-DARTS Framework</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f3ff 0%, #e8f4f8 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #2c2c2a;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            padding: 40px;
            border-bottom: 1px solid #e5e5e0;
            background: linear-gradient(135deg, #f0ecff 0%, #eef8fb 100%);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #1a1a18;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            font-weight: 400;
        }

        .diagram-container {
            padding: 40px;
            background: #fafaf8;
            overflow-x: auto;
            border-top: 2px solid #e5e5e0;
        }

        .diagram-container svg {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .footer {
            padding: 20px 40px;
            background: #f5f3f0;
            border-top: 1px solid #e5e5e0;
            font-size: 12px;
            color: #888;
            text-align: center;
            font-style: italic;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }

            .header {
                padding: 24px;
            }

            h1 {
                font-size: 20px;
            }

            .subtitle {
                font-size: 12px;
            }

            .diagram-container {
                padding: 20px;
            }

            .footer {
                padding: 16px 20px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MT-DARTS Framework</h1>
            <p class="subtitle">Multi-task Differentiable Architecture Search for medical imaging</p>
        </div>

        <div class="diagram-container">
            <svg width="100%" viewBox="0 0 680 1420" role="img" xmlns="http://www.w3.org/2000/svg"
  style="font-family: system-ui, sans-serif; background: white;">
  <title>MT-DARTS Framework Diagram</title>
  <desc>End-to-end multi-task differentiable architecture search pipeline for MedMNIST, showing four phases: bilevel search, discretization, retraining, and evaluation.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <!-- Color fills (light mode values) -->
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; fill: #2C2C2A; }
      .th  { font-size: 14px; font-weight: 500; }
      .ts  { font-size: 12px; font-weight: 400; fill: #5F5E5A; }

      /* Purple – search / model */
      .c-purple rect, .c-purple circle { fill: #EEEDFE; stroke: #534AB7; }
      .c-purple .th { fill: #3C3489; }
      .c-purple .ts { fill: #534AB7; }

      /* Teal – data */
      .c-teal rect, .c-teal circle { fill: #E1F5EE; stroke: #0F6E56; }
      .c-teal .th { fill: #085041; }
      .c-teal .ts { fill: #0F6E56; }

      /* Amber – optimization */
      .c-amber rect, .c-amber circle { fill: #FAEEDA; stroke: #854F0B; }
      .c-amber .th { fill: #633806; }
      .c-amber .ts { fill: #854F0B; }

      /* Coral – phase badges */
      .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
      .c-coral .th  { fill: #712B13; }

      /* Gray – outputs */
      .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
      .c-gray .th  { fill: #2C2C2A; }
      .c-gray .ts  { fill: #5F5E5A; }

      /* Dashed containers */
      .dash-purple { fill: none; stroke: #534AB7; stroke-width: 1; stroke-dasharray: 5 4; opacity: 0.5; }
      .dash-amber  { fill: none; stroke: #BA7517; stroke-width: 1; stroke-dasharray: 5 4; opacity: 0.45; }
      .dash-gray   { fill: none; stroke: #5F5E5A; stroke-width: 1; stroke-dasharray: 5 4; opacity: 0.45; }

      /* Arrows */
      line, path.arr { fill: none; stroke: #888780; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- HEADER -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <text class="th" x="340" y="30" text-anchor="middle" font-size="17">MT-DARTS — Multi-Task Differentiable Architecture Search</text>
  <text class="ts" x="340" y="50" text-anchor="middle">Joint architecture search for three medical imaging tasks on MedMNIST</text>

  <!-- Legend -->
  <g class="c-purple"><rect x="40"  y="64" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts" x="58"  y="74">Search / model</text>
  <g class="c-teal">  <rect x="160" y="64" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts" x="178" y="74">Data</text>
  <g class="c-amber">  <rect x="228" y="64" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts" x="246" y="74">Optimization</text>
  <g class="c-coral">  <rect x="352" y="64" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts" x="370" y="74">Phase marker</text>
  <g class="c-gray">   <rect x="464" y="64" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts" x="482" y="74">Output</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- SECTION 0 – Setup -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <text class="ts" x="340" y="100" text-anchor="middle" font-style="italic">Step 0 — Setup: data &amp; model</text>

  <!-- Dataset boxes -->
  <g class="c-teal">
    <rect x="40"  y="112" width="160" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="120" y="132" text-anchor="middle">PathMNIST</text>
    <text class="ts" x="120" y="150" text-anchor="middle">9-class, single-label</text>
  </g>
  <g class="c-teal">
    <rect x="260" y="112" width="160" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="132" text-anchor="middle">ChestMNIST</text>
    <text class="ts" x="340" y="150" text-anchor="middle">14-class, multi-label</text>
  </g>
  <g class="c-teal">
    <rect x="480" y="112" width="160" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="560" y="132" text-anchor="middle">DermaMNIST</text>
    <text class="ts" x="560" y="150" text-anchor="middle">7-class, single-label</text>
  </g>

  <!-- Arrows into unified pipeline -->
  <line x1="120" y1="164" x2="270" y2="194" stroke="#1D9E75" marker-end="url(#arrow)"/>
  <line x1="340" y1="164" x2="340" y2="194" stroke="#1D9E75" marker-end="url(#arrow)"/>
  <line x1="560" y1="164" x2="408" y2="194" stroke="#1D9E75" marker-end="url(#arrow)"/>

  <!-- Unified data pipeline -->
  <g class="c-teal">
    <rect x="200" y="196" width="280" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="216" text-anchor="middle">Task-aware data pipeline</text>
    <text class="ts" x="340" y="234" text-anchor="middle">Mixed batches + task IDs + custom collation</text>
  </g>

  <!-- Split into 3 loaders -->
  <line x1="280" y1="248" x2="220" y2="279" stroke="#1D9E75" marker-end="url(#arrow)"/>
  <line x1="340" y1="248" x2="340" y2="279" stroke="#1D9E75" marker-end="url(#arrow)"/>
  <line x1="400" y1="248" x2="460" y2="279" stroke="#1D9E75" marker-end="url(#arrow)"/>

  <g class="c-teal">
    <rect x="110" y="280" width="132" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="176" y="298" text-anchor="middle">Train loader</text>
    <text class="ts" x="176" y="314" text-anchor="middle">Weight updates</text>
  </g>
  <g class="c-teal">
    <rect x="274" y="280" width="132" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="298" text-anchor="middle">Val loader</text>
    <text class="ts" x="340" y="314" text-anchor="middle">Alpha updates</text>
  </g>
  <g class="c-teal">
    <rect x="438" y="280" width="132" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="504" y="298" text-anchor="middle">Test loader</text>
    <text class="ts" x="504" y="314" text-anchor="middle">Final evaluation</text>
  </g>

  <!-- Supernet section label -->
  <text class="ts" x="340" y="354" text-anchor="middle" font-style="italic">Supernet — shared feature extractor + task-specific heads</text>

  <!-- Supernet dashed container -->
  <rect class="dash-purple" x="40" y="364" width="600" height="196" rx="14"/>
  <text class="ts" x="56" y="380" font-style="italic">TaskAwareSupernet</text>

  <!-- Shared stem -->
  <g class="c-purple">
    <rect x="64"  y="388" width="128" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="128" y="408" text-anchor="middle">Shared stem</text>
    <text class="ts" x="128" y="426" text-anchor="middle">Conv + BN, 3→28×28</text>
  </g>

  <line x1="192" y1="414" x2="220" y2="414" stroke="#534AB7" marker-end="url(#arrow)"/>

<!-- MixedOp cells -->
<g class="c-purple">
  <rect x="220" y="380" width="200" height="120" rx="10" stroke-width="0.5"/>
  <!-- Titles -->
  <text class="th" x="320" y="405" text-anchor="middle">L × MixedOp cells</text>
  <text class="ts" x="320" y="425" text-anchor="middle">Weighted mix of ops</text>
  <!-- Row 1 -->
  <rect x="225" y="440" width="75" height="20" rx="6" stroke-width="0.5"/>
  <text class="ts" x="262" y="454" text-anchor="middle" font-size="5">MBConv3×3</text>
  <rect x="305" y="440" width="72" height="20" rx="6" stroke-width="0.5"/>
  <text class="ts" x="341" y="454" text-anchor="middle" font-size="5">MBConv5×5</text>
  <rect x="380" y="440" width="35" height="20" rx="6" stroke-width="0.5"/>
  <text class="ts" x="395" y="454" text-anchor="middle" font-size="5">Zero</text>
  <!-- Row 2 -->
  <rect x="235" y="470" width="95" height="20" rx="6" stroke-width="0.5"/>
  <text class="ts" x="282" y="484" text-anchor="middle" font-size="5">DilatedConv3×3</text>
  <rect x="335" y="470" width="80" height="20" rx="6" stroke-width="0.5"/>
  <text class="ts" x="375" y="484" text-anchor="middle" font-size="5">SkipConnect</text>
</g>


  <!-- Arrows to task heads -->
  <line x1="420" y1="450" x2="430" y2="420" stroke="#534AB7" marker-end="url(#arrow)"/>
  <line x1="420" y1="450" x2="430" y2="450" stroke="#534AB7" marker-end="url(#arrow)"/>
  <line x1="420" y1="450" x2="430" y2="487" stroke="#534AB7" marker-end="url(#arrow)"/>

  <!-- Task heads -->
  <g class="c-purple">
    <rect x="432" y="398" width="176" height="36" rx="8" stroke-width="0.5"/>
    <text class="th" x="520" y="414" text-anchor="middle">Head₀: PathMNIST (9)</text>
    <text class="ts" x="520" y="428" text-anchor="middle">CrossEntropy</text>
  </g>
  <g class="c-purple">
    <rect x="432" y="440" width="176" height="36" rx="8" stroke-width="0.5"/>
    <text class="th" x="520" y="456" text-anchor="middle">Head₁: ChestMNIST (14)</text>
    <text class="ts" x="520" y="470" text-anchor="middle">BCEWithLogits</text>
  </g>
  <g class="c-purple">
    <rect x="432" y="482" width="176" height="36" rx="8" stroke-width="0.5"/>
    <text class="th" x="520" y="498" text-anchor="middle">Head₂: DermaMNIST (7)</text>
    <text class="ts" x="520" y="512" text-anchor="middle">CrossEntropy</text>
  </g>

  <!-- α annotations -->
  <text class="ts" x="60" y="520" font-style="italic">α ∈ ℝ^{T×L×O}: per-task architecture logits</text>
  <text class="ts" x="60" y="536" font-style="italic">π = Sparsemax(α/τ)  →  h_{ℓ+1} = Σ π_o · op_o(h_ℓ)</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- PHASE A – Bilevel Search -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <g class="c-coral">
    <rect x="40" y="572" width="180" height="28" rx="14" stroke-width="0.5"/>
    <text class="th" x="130" y="591" text-anchor="middle">Phase A — Bilevel Search</text>
  </g>
  <text class="ts" x="234" y="590">Train the supernet while updating architecture logits</text>

  <!-- Epoch loop dashed container -->
  <rect class="dash-amber" x="40" y="608" width="600" height="284" rx="14"/>
  <text class="ts" x="56" y="624" font-style="italic">For each epoch</text>

  <!-- Weight step -->
  <g class="c-amber">
    <rect x="64" y="632" width="200" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="164" y="652" text-anchor="middle">① Weight step (train batch)</text>
    <text class="ts" x="164" y="670" text-anchor="middle">SGD + cosine annealing on w</text>
  </g>

  <line x1="264" y1="658" x2="296" y2="658" stroke="#BA7517" marker-end="url(#arrow)"/>

  <!-- Alpha step decision -->
  <g class="c-amber">
    <rect x="296" y="632" width="200" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="396" y="648" text-anchor="middle">② Alpha step?</text>
    <text class="ts" x="396" y="664" text-anchor="middle">Only when step mod freq = 0</text>
    <text class="ts" x="396" y="678" text-anchor="middle">Delayed architecture updates</text>
  </g>

  <line x1="496" y1="658" x2="530" y2="658" stroke="#BA7517" marker-end="url(#arrow)"/>

  <!-- Adam step -->
  <g class="c-amber">
    <rect x="522" y="632" width="108" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="576" y="650" text-anchor="middle">③ Adam update</text>
    <text class="ts" x="576" y="666" text-anchor="middle">Validation batch</text>
    <text class="ts" x="576" y="680" text-anchor="middle">Update α only</text>
  </g>

  <line x1="320" y1="684" x2="320" y2="720" stroke="#BA7517" marker-end="url(#arrow)"/>
  <text class="ts" x="325" y="707">No: skip α update</text>
  <line x1="576" y1="684" x2="576" y2="712" stroke="#BA7517" marker-end="url(#arrow)"/>
  <text class="ts" x="548" y="707">Yes</text>

  <!-- Sparsemax -->
  <g class="c-amber">
    <rect x="64" y="722" width="280" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="204" y="742" text-anchor="middle">Sparsemax normalisation</text>
    <text class="ts" x="204" y="758" text-anchor="middle">π = Sparsemax(α/τ) — sparse, not softmax</text>
  </g>

  <!-- Tau schedule -->
  <g class="c-amber">
    <rect x="374" y="722" width="256" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="502" y="742" text-anchor="middle">Temperature annealing</text>
    <text class="ts" x="502" y="758" text-anchor="middle">τ_e = max(τ₀ · a^⌊e/m⌋, 0.01)</text>
  </g>

  <!-- Entropy check -->
  <line x1="204" y1="774" x2="204" y2="800" stroke="#BA7517" marker-end="url(#arrow)"/>
  <line x1="502" y1="774" x2="502" y2="800" stroke="#BA7517" marker-end="url(#arrow)"/>
  <g class="c-amber">
    <rect x="150" y="800" width="380" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="820" text-anchor="middle">Entropy-based early stopping</text>
    <text class="ts" x="340" y="838" text-anchor="middle">H = –(1/TL) Σ π log π — stop if H &lt; ε</text>
  </g>
  <text class="ts" x="64" y="886" font-style="italic">↻ repeat until entropy &lt; threshold or max epochs reached</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- PHASE B – Discretisation -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <line x1="340" y1="892" x2="340" y2="910" stroke="#888780" marker-end="url(#arrow)"/>

  <g class="c-coral">
    <rect x="40" y="905" width="200" height="28" rx="14" stroke-width="0.5"/>
    <text class="th" x="140" y="924" text-anchor="middle">Phase B — Discretisation</text>
  </g>
  <text class="ts" x="254" y="928">Pick one op per layer per task</text>

  <rect class="dash-purple" x="40" y="940" width="600" height="138" rx="14"/>

  <g class="c-purple">
    <rect x="90" y="946" width="500" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="966" text-anchor="middle">Argmax over α per task</text>
    <text class="ts" x="340" y="984" text-anchor="middle" font-size="11">ô_{t,ℓ} = argmax_o α_{t,ℓ,o} — build three task-specific discrete models</text>
  </g>

  <line x1="220" y1="998" x2="150" y2="1025" stroke="#534AB7" marker-end="url(#arrow)"/>
  <line x1="340" y1="998" x2="340"  y2="1025" stroke="#534AB7" marker-end="url(#arrow)"/>
  <line x1="460" y1="998" x2="530"  y2="1025" stroke="#534AB7" marker-end="url(#arrow)"/>

  <g class="c-purple">
    <rect x="50"  y="1026" width="170" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="135" y="1046" text-anchor="middle">Discrete model₀</text>
    <text class="ts" x="135" y="1062" text-anchor="middle">Path: chosen ops + head₀</text>
  </g>
  <g class="c-purple">
    <rect x="255" y="1026" width="170" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1046" text-anchor="middle">Discrete model₁</text>
    <text class="ts" x="340" y="1062" text-anchor="middle">Chest: chosen ops + head₁</text>
  </g>
  <g class="c-purple">
    <rect x="460" y="1026" width="170" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="545" y="1046" text-anchor="middle">Discrete model₂</text>
    <text class="ts" x="545" y="1062" text-anchor="middle">Derma: chosen ops + head₂</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- PHASE C – Retrain -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <line x1="170" y1="1070" x2="280" y2="1098" stroke="#888780" marker-end="url(#arrow)"/>
  <line x1="340" y1="1070" x2="340" y2="1098" stroke="#888780" marker-end="url(#arrow)"/>
  <line x1="510" y1="1070" x2="398" y2="1098" stroke="#888780" marker-end="url(#arrow)"/>

  <g class="c-coral">
    <rect x="40" y="1098" width="220" height="28" rx="14" stroke-width="0.5"/>
    <text class="th" x="150" y="1117" text-anchor="middle">Phase C — Retrain from scratch</text>
  </g>
  <text class="ts" x="274" y="1116">Re-init weights; train on task-only data</text>

  <rect class="dash-purple" x="40" y="1134" width="600" height="90" rx="14"/>

  <g class="c-purple">
    <rect x="64"  y="1148" width="152" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="140" y="1165" text-anchor="middle">Reinitialise weights</text>
    <text class="ts" x="140" y="1181" text-anchor="middle">Random init, no supernet</text>
  </g>

  <line x1="216" y1="1170" x2="246" y2="1170" stroke="#534AB7" marker-end="url(#arrow)"/>

  <g class="c-purple">
    <rect x="246" y="1148" width="152" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="322" y="1165" text-anchor="middle">Train (SGD + cosine)</text>
    <text class="ts" x="322" y="1181" text-anchor="middle">Only task-k samples</text>
  </g>

  <line x1="398" y1="1170" x2="428" y2="1170" stroke="#534AB7" marker-end="url(#arrow)"/>

  <g class="c-purple">
    <rect x="428" y="1148" width="152" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="504" y="1165" text-anchor="middle">Keep best checkpoint</text>
    <text class="ts" x="504" y="1181" text-anchor="middle">Validate by AUC</text>
  </g>

  <text class="ts" x="340" y="1220" text-anchor="middle" font-style="italic">Repeat for each of the 3 task models independently</text>


  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- PHASE D – Benchmark Report -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <g class="c-coral">
    <rect x="40" y="1240" width="200" height="28" rx="14" stroke-width="0.5"/>
    <text class="th" x="140" y="1259" text-anchor="middle">Phase D — Benchmark report</text>
  </g>
  <rect class="dash-gray" x="40" y="1275" width="600" height="90" rx="14"/>
  <!-- Output boxes -->
  <g class="c-gray">
    <rect x="64"  y="1296" width="162" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="145" y="1316" text-anchor="middle">Per-task metrics</text>
    <text class="ts" x="145" y="1332" text-anchor="middle">ACC / AUC / loss</text>
